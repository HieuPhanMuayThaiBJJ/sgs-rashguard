name: trim-lookbook
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trim-lookbook.yml'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only lookbook frames 03, 06, 08
        run: |
          set -e
          sed -i -E '/^\s*\{k:"(m5|f2|lookLong|f5|f4|m2)"/d' index.html
          grep -nE '^\s*\{k:"' index.html
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Lookbook: keep only frames 03, 06, 08" || echo nothing
          git push
