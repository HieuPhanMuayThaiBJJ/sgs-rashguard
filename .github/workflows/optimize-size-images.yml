name: optimize-size-images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick >/dev/null; then C=magick; else C=convert; fi
          ls -la
          S=$(ls Combat*.png | head -1)
          R=$(ls Rashguard*.png | head -1)
          $C "$S" -resize 700x -strip -quality 80 size-shorts.jpg
          $C "$R" -resize 700x -strip -quality 80 size-shirts.jpg
          git rm -q -- "$S" "$R"
          ls -la size-*.jpg
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Optimize size guide images"
          git push
